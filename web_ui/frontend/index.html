<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/agentscope.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>AgentScope</title>
		<script>
			// Polyfill for insecure contexts (plain HTTP over LAN IP):
			// crypto.randomUUID is only exposed on HTTPS / localhost.
			if (!window.crypto) window.crypto = window.msCrypto || {};
			if (!window.crypto.randomUUID) {
				window.crypto.randomUUID = function () {
					return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(
						/[xy]/g,
						function (c) {
							var r = (Math.random() * 16) | 0;
							var v = c === 'x' ? r : (r & 0x3) | 0x8;
							return v.toString(16);
						}
					);
				};
			}
		</script>
		<script>
			// Applied before the first paint, so the theme never flashes.
			const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
			const applyTheme = () =>
				document.documentElement.classList.toggle('dark', darkQuery.matches);
			applyTheme();
			darkQuery.addEventListener('change', applyTheme);
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
